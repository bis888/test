<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个页面</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Microsoft YaHei", sans-serif;
      color: #172033;
      background: #f3f6fb;
    }
    main {
      width: min(90%, 420px);
      padding: 36px;
      text-align: center;
      background: #fff;
      border: 1px solid #e4e9f2;
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(40, 64, 110, 0.08);
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 0 0 24px; color: #68738a; line-height: 1.7; }
    button {
      padding: 12px 24px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: #356df3;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #2458d4; }
    #count { margin-top: 18px; font-weight: 700; color: #356df3; }
  </style>
</head>
<body>
  <main>
    <h1>页面运行成功</h1>
    <p>这是一个独立的 index.html 文件，无需安装任何依赖。</p>
    <button id="button" type="button">点我试试</button>
    <div id="count" aria-live="polite">已点击 0 次</div>
  </main>
  <script>
    let count = 0;
    const button = document.getElementById('button');
    const output = document.getElementById('count');
    button.addEventListener('click', () => {
      count += 1;
      output.textContent = `已点击 ${count} 次`;
    });
  </script>
</body>
</html>
